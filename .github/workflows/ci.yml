name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check for a release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      BRIM_REAL_ENV: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Check Xcode and SDK
        id: toolchain
        run: |
          ./scripts/check_toolchain.sh
          mkdir -p "$RUNNER_TEMP/brim-ci"
          printf 'xcode=%s\n' "$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache package build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: BrimCore/.build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-spm-${{ hashFiles('BrimCore/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-spm-

      - name: Build package
        run: |
          swift build --package-path BrimCore --force-resolved-versions \
            -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors \
            2>&1 | tee "$RUNNER_TEMP/brim-ci/package-build.log"

      - name: Run package tests
        run: |
          swift test --package-path BrimCore --force-resolved-versions \
            -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors \
            2>&1 | tee "$RUNNER_TEMP/brim-ci/package-tests.log"

      - name: Build app and helper in Debug and Release
        run: |
          for configuration in Debug Release; do
            xcodebuild build -project Brim.xcodeproj -scheme brim \
              -configuration "$configuration" -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/brim-derived-data" \
              -resultBundlePath "$RUNNER_TEMP/brim-ci/$configuration.xcresult" \
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO SWIFT_SUPPRESS_WARNINGS=NO \
              OTHER_SWIFT_FLAGS='-strict-concurrency=complete -warnings-as-errors' \
              2>&1 | tee "$RUNNER_TEMP/brim-ci/$configuration.log"
          done

      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brim-ci
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint & Format
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install check tools
        run: |
          brew install swiftformat swiftlint actionlint shellcheck
          swiftformat --version
          swiftlint version
          actionlint --version
          shellcheck --version

      - name: Check workflows and shell scripts
        run: |
          actionlint
          shellcheck scripts/*.sh

      - name: Test check and release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Reject added lint violations
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/lint_changes.py --base "$LINT_BASE"
