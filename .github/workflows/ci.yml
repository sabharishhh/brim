name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test
    # The application targets macOS 27. Use its SDK and compiler in CI too.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Toolchain
      run: xcodebuild -version && swift --version

    - name: Cache SPM
      uses: actions/cache@v4
      with:
        path: BrimCore/.build
        key: ${{ runner.os }}-${{ runner.arch }}-xcode27-spm-${{ hashFiles('BrimCore/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-xcode27-spm-

    - name: Build BrimCore Package
      working-directory: ./BrimCore
      run: |
        swift build \
          -Xswiftc -strict-concurrency=complete \
          -Xswiftc -warnings-as-errors

    - name: Test BrimCore Package
      working-directory: ./BrimCore
      run: |
        swift test \
          -Xswiftc -strict-concurrency=complete \
          -Xswiftc -warnings-as-errors

    - name: Build Xcode Project
      run: |
        xcodebuild clean build \
          -project Brim.xcodeproj \
          -scheme brim \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_SUPPRESS_WARNINGS=NO \
          OTHER_SWIFT_FLAGS="-strict-concurrency=complete -warnings-as-errors"

  lint:
    name: Lint & Format
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Linters
      run: brew install swiftformat swiftlint

    - name: Test lint comparison
      run: python3 -m unittest discover -s scripts -p 'test_lint_changes.py'

    - name: Reject added lint violations
      env:
        LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 scripts/lint_changes.py --base "$LINT_BASE"
